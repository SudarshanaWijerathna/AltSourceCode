[project]
name = "mira"
version = "0.1.0"
description = "Mira - AI travel booking assistant backend (LangGraph + FastAPI)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "langgraph>=0.6",
  "langchain-core>=0.3",
  "langchain-google-genai>=2.0",
  "langfuse>=3.0",
  "openpyxl>=3.1",
  "python-frontmatter>=1.1",
  "sqlmodel>=0.0.22",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mira*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
